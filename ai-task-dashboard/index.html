<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIタスク ダッシュボード</title>
<style>
/* tokens.css（tokens.json から生成） */
:root, [data-theme="light"] {
  --bg: #f4f5f7;
  --surface: #ffffff;
  --surface-muted: #eef0f3;
  --line: #dfe2e7;
  --line-strong: #868e9b;
  --ink: #16191e;
  --ink-muted: #525a66;
  --primary: var(--ink);
  --on-primary: var(--surface);
  --focus: #2459c4;
  --run: #4f8df5;
  --on-run: #0b1a33;
  --run-text: #1d4fa6;
  --run-soft: #e7eefb;
  --wait: #f1b324;
  --on-wait: #2a1c00;
  --wait-text: #7a4300;
  --wait-soft: #fff1d2;
  --stop: #b3261e;
  --on-stop: #ffffff;
  --stop-text: #a3231a;
  --stop-soft: #fcebe9;
  --done: #d3d7de;
  --on-done: #2c323b;
  --done-text: #4c5461;
  --done-soft: #eceef1;
  --focus-ring: 0 0 0 2px #ffffff, 0 0 0 4px #2459c4;
}
[data-theme="dark"] {
  --bg: #111318;
  --surface: #1a1d23;
  --surface-muted: #23272e;
  --line: #30353d;
  --line-strong: #717a87;
  --ink: #eef1f5;
  --ink-muted: #a9b0bb;
  --primary: var(--ink);
  --on-primary: var(--surface);
  --focus: #8db4ff;
  --run: #8ab4ff;
  --on-run: #0b1a33;
  --run-text: #9fc0ff;
  --run-soft: #172a4a;
  --wait: #f1b324;
  --on-wait: #2a1c00;
  --wait-text: #ffcd6b;
  --wait-soft: #3a2a0a;
  --stop: #e5483a;
  --on-stop: #ffffff;
  --stop-text: #ffa49c;
  --stop-soft: #44191a;
  --done: #4b525d;
  --on-done: #eef1f5;
  --done-text: #b6bdc7;
  --done-soft: #272b32;
  --focus-ring: 0 0 0 2px #1a1d23, 0 0 0 4px #8db4ff;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme]) {
  --bg: #111318;
  --surface: #1a1d23;
  --surface-muted: #23272e;
  --line: #30353d;
  --line-strong: #717a87;
  --ink: #eef1f5;
  --ink-muted: #a9b0bb;
  --primary: var(--ink);
  --on-primary: var(--surface);
  --focus: #8db4ff;
  --run: #8ab4ff;
  --on-run: #0b1a33;
  --run-text: #9fc0ff;
  --run-soft: #172a4a;
  --wait: #f1b324;
  --on-wait: #2a1c00;
  --wait-text: #ffcd6b;
  --wait-soft: #3a2a0a;
  --stop: #e5483a;
  --on-stop: #ffffff;
  --stop-text: #ffa49c;
  --stop-soft: #44191a;
  --done: #4b525d;
  --on-done: #eef1f5;
  --done-text: #b6bdc7;
  --done-soft: #272b32;
  --focus-ring: 0 0 0 2px #1a1d23, 0 0 0 4px #8db4ff;
  }
}
:root {
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --radius-sm: 4px;
  --radius-md: 6px;
  --radius-lg: 10px;
  --radius-full: 9999px;
  --control-h: 40px;
  --control-h-touch: 44px;
  --mark: 18px;
  --mark-lg: 24px;
  --content-max: 1040px;
  --font-sans: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", Meiryo, system-ui, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
.t-title { font-family: var(--font-sans); font-size: 20px; line-height: 28px; font-weight: 700; }
.t-heading { font-family: var(--font-sans); font-size: 16px; line-height: 24px; font-weight: 700; }
.t-task { font-family: var(--font-sans); font-size: 15px; line-height: 22px; font-weight: 600; }
.t-body { font-family: var(--font-sans); font-size: 14px; line-height: 22px; font-weight: 400; }
.t-label { font-family: var(--font-sans); font-size: 14px; line-height: 20px; font-weight: 600; }
.t-tag { font-family: var(--font-sans); font-size: 13px; line-height: 18px; font-weight: 600; }
.t-meta { font-family: var(--font-sans); font-size: 12px; line-height: 18px; font-weight: 400; }
.t-count { font-family: var(--font-sans); font-size: 28px; line-height: 32px; font-weight: 700; }
.t-code { font-family: var(--font-mono); font-size: 13px; line-height: 20px; font-weight: 400; }

/* components/bundle.css */
/* AIタスク ダッシュボード — 部品のスタイル。値はすべて tokens.css の変数から取る。 */
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-sans); font-size: 14px; line-height: 22px; -webkit-text-size-adjust: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
.ad-sr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.ad-num { font-variant-numeric: tabular-nums; }
:where(.ad-btn, .ad-chip, .ad-tile, .ad-row__toggle, .ad-input, .ad-select, .ad-option input, .ad-check input):focus-visible { outline: 2px solid transparent; outline-offset: 2px; box-shadow: var(--focus-ring); }
[tabindex="-1"]:focus { outline: none; }

/* スマホ幅では押せるものを 44px に */
@media (max-width: 600px) { .ad-btn, .ad-chip, .ad-input, .ad-select { min-height: var(--control-h-touch); } }

/* 状態の印：色・記号・枠の3つで1組。言葉（バッジ等）と必ず並べる */
.ad-mark { display: inline-flex; align-items: center; justify-content: center; flex: none; width: var(--mark); height: var(--mark); border-radius: var(--radius-full); border: 1px solid; }
.ad-mark svg { width: 12px; height: 12px; display: block; }
.ad-mark--lg { width: var(--mark-lg); height: var(--mark-lg); }
.ad-mark--lg svg { width: 16px; height: 16px; }
.ad-mark--run { background: var(--run); color: var(--on-run); border-color: var(--run-text); }
.ad-mark--wait { background: var(--wait); color: var(--on-wait); border-color: var(--wait-text); }
.ad-mark--stop { background: var(--stop); color: var(--on-stop); border-color: var(--stop-text); }
.ad-mark--done { background: var(--done); color: var(--on-done); border-color: var(--done-text); }
.ad-mark--todo { background: var(--surface); color: var(--ink-muted); border-color: var(--line-strong); }

/* 状態バッジ */
.ad-badge { display: inline-flex; align-items: center; gap: var(--space-1); min-height: 24px; padding: 2px var(--space-2) 2px 3px; border-radius: var(--radius-sm); white-space: nowrap; }
.ad-badge--run { background: var(--run-soft); color: var(--run-text); }
.ad-badge--wait { background: var(--wait-soft); color: var(--wait-text); }
.ad-badge--stop { background: var(--stop-soft); color: var(--stop-text); }
.ad-badge--done { background: var(--done-soft); color: var(--done-text); }

/* ボタン：primary は「あなたの番」の操作だけ */
.ad-btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); min-height: var(--control-h); padding: 0 var(--space-4); border-radius: var(--radius-md); border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); cursor: pointer; text-decoration: none; white-space: nowrap; }
.ad-btn:hover { background: var(--surface-muted); }
.ad-btn--primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.ad-btn--primary:hover { background: var(--primary); opacity: .86; }
.ad-btn--quiet { border-color: transparent; background: none; padding: 0 var(--space-2); text-decoration: underline; text-underline-offset: 3px; }
.ad-btn--quiet:hover { background: var(--surface-muted); }
.ad-btn--block { width: 100%; }
.ad-btn[disabled], .ad-btn[aria-disabled="true"] { cursor: not-allowed; background: var(--surface-muted); border-color: var(--line); color: var(--ink-muted); opacity: 1; }
.ad-btn[aria-busy="true"] { cursor: progress; }
.ad-btn svg { width: 14px; height: 14px; flex: none; }

/* 担当AIのタグ：色は使わず名前だけで区別する */
.ad-agent { display: inline-flex; align-items: center; min-height: 24px; padding: 2px var(--space-2); border: 1px solid var(--line-strong); border-radius: var(--radius-sm); background: var(--surface); color: var(--ink); white-space: nowrap; }

/* 絞り込みチップ：選択は ✓ と太い枠で示す（色に頼らない） */
.ad-chip { display: inline-flex; align-items: center; gap: var(--space-1); min-height: var(--control-h); padding: 0 var(--space-3); border: 1px solid var(--line-strong); border-radius: var(--radius-md); background: var(--surface); color: var(--ink); cursor: pointer; white-space: nowrap; }
.ad-chip:hover { background: var(--surface-muted); }
.ad-chip__check { display: none; width: 14px; height: 14px; }
.ad-chip__count { color: var(--ink-muted); font-weight: 400; }
.ad-chip[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); background: var(--surface-muted); }
.ad-chip[aria-pressed="true"] .ad-chip__check { display: block; }

/* 状況タイル：件数を見せ、押すとその状態で絞り込む */
.ad-tile { display: grid; grid-template-columns: auto 1fr; grid-template-areas: "mark word" "count count" "note note"; align-items: center; column-gap: var(--space-2); row-gap: var(--space-1); width: 100%; min-width: 0; padding: var(--space-3); border: 1px solid var(--line-strong); border-radius: var(--radius-md); background: var(--surface); color: var(--ink); text-align: left; cursor: pointer; }
.ad-tile:hover { background: var(--surface-muted); }
.ad-tile .ad-mark { grid-area: mark; }
.ad-tile__word { grid-area: word; min-width: 0; }
.ad-tile__count { grid-area: count; }
.ad-tile__note { grid-area: note; color: var(--ink-muted); }
.ad-tile__note--on { display: inline-flex; align-items: center; gap: var(--space-1); color: var(--ink); font-weight: 600; }
.ad-tile__note--on svg { width: 12px; height: 12px; flex: none; }
.ad-tile[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.ad-tile--run .ad-tile__word { color: var(--run-text); }
.ad-tile--wait .ad-tile__word { color: var(--wait-text); }
.ad-tile--stop .ad-tile__word { color: var(--stop-text); }
.ad-tile--done .ad-tile__word { color: var(--done-text); }
.ad-tile[aria-pressed="true"].ad-tile--run { background: var(--run-soft); }
.ad-tile[aria-pressed="true"].ad-tile--wait { background: var(--wait-soft); }
.ad-tile[aria-pressed="true"].ad-tile--stop { background: var(--stop-soft); }
.ad-tile[aria-pressed="true"].ad-tile--done { background: var(--done-soft); }

/* 進捗バー */
.ad-progress { display: inline-flex; align-items: center; gap: var(--space-2); }
.ad-progress__bar { position: relative; width: 72px; height: 6px; border-radius: var(--radius-sm); background: var(--run-soft); border: 1px solid var(--run-text); overflow: hidden; flex: none; }
.ad-progress__fill { position: absolute; inset: 0 auto 0 0; background: var(--run-text); }

/* タスク行 */
.ad-row { list-style: none; }
.ad-row__main { display: grid; grid-template-columns: 132px minmax(0, 1fr) auto; grid-template-areas: "status body action"; column-gap: var(--space-4); align-items: start; padding: var(--space-3) var(--space-4); }
.ad-row__status { grid-area: status; display: flex; flex-direction: column; align-items: flex-start; gap: var(--space-1); padding-top: 1px; }
.ad-row__since { color: var(--ink-muted); }
.ad-row__body { grid-area: body; min-width: 0; display: flex; flex-direction: column; gap: var(--space-1); }
.ad-row__title { margin: 0; }
.ad-row__toggle { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; width: 100%; padding: 0; border: 0; background: none; color: var(--ink); text-align: left; cursor: pointer; overflow-wrap: anywhere; word-break: normal; border-radius: var(--radius-sm); }
.ad-row__toggle:hover { text-decoration: underline; text-underline-offset: 3px; }
.ad-row.is-open .ad-row__toggle { -webkit-line-clamp: unset; display: block; }
.ad-row__line { margin: 0; color: var(--ink); display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; overflow-wrap: anywhere; }
.ad-row.is-open .ad-row__line { display: none; }
.ad-row__lead { font-weight: 600; margin-right: var(--space-1); }
.ad-row__lead--wait { color: var(--wait-text); }
.ad-row__lead--stop { color: var(--stop-text); }
.ad-row__meta { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-1) var(--space-2); color: var(--ink-muted); }
.ad-row__action { grid-area: action; display: flex; justify-content: flex-end; }
.ad-row__detail { padding: 0 var(--space-4) var(--space-4); }
.ad-row__detail[hidden] { display: none; }
@media (max-width: 600px) {
  .ad-row__main { grid-template-columns: minmax(0, 1fr); grid-template-areas: "status" "body" "action"; row-gap: var(--space-2); }
  .ad-row__status { flex-direction: row; align-items: center; gap: var(--space-2); }
  .ad-row__action .ad-btn { width: 100%; }
  .ad-row__action .ad-btn--quiet { width: auto; }
  .ad-row__action { justify-content: stretch; }
}

/* 詳細の中の区画 */
.ad-panel { border-radius: var(--radius-lg); padding: var(--space-4); background: var(--surface-muted); }
.ad-panel--wait { background: var(--wait-soft); border: 1px solid var(--wait-text); }
.ad-panel--stop { background: var(--stop-soft); border: 1px solid var(--stop-text); }
.ad-panel__head { display: flex; align-items: center; gap: var(--space-2); margin: 0 0 var(--space-2); }
.ad-panel p { margin: 0; }
.ad-panel p + p { margin-top: var(--space-2); }

/* 入力 */
.ad-input, .ad-select { width: 100%; min-height: var(--control-h); padding: var(--space-2) var(--space-3); border: 1px solid var(--line-strong); border-radius: var(--radius-md); background: var(--surface); color: var(--ink); }
.ad-select { width: auto; max-width: 100%; }
textarea.ad-input { min-height: 72px; resize: vertical; display: block; }
.ad-input[aria-invalid="true"] { border-color: var(--stop-text); box-shadow: inset 0 0 0 1px var(--stop-text); }
.ad-input::placeholder { color: var(--ink-muted); opacity: 1; }
.ad-field { display: flex; flex-direction: column; gap: var(--space-1); min-width: 0; }
.ad-field__hint { color: var(--ink-muted); }

/* 回答フォーム */
.ad-answer { display: flex; flex-direction: column; gap: var(--space-4); }
.ad-answer fieldset { margin: 0; padding: 0; border: 0; min-width: 0; display: flex; flex-direction: column; gap: var(--space-2); }
.ad-answer legend { padding: 0; margin-bottom: var(--space-2); }
.ad-option { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: var(--space-3); align-items: start; padding: var(--space-3); border: 1px solid var(--line-strong); border-radius: var(--radius-md); background: var(--surface); cursor: pointer; }
.ad-option input { margin: 3px 0 0; width: 18px; height: 18px; accent-color: var(--ink); border-radius: var(--radius-full); }
.ad-option__text { display: flex; flex-direction: column; min-width: 0; overflow-wrap: anywhere; }
.ad-option__hint { color: var(--ink-muted); }
.ad-option:has(input:checked) { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.ad-option:hover { background: var(--surface-muted); }
fieldset[aria-invalid="true"] .ad-option { border-color: var(--stop-text); }
.ad-error { display: flex; align-items: flex-start; gap: var(--space-2); margin: 0; color: var(--stop-text); }
.ad-error .ad-mark { margin-top: 1px; }
.ad-actions { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); }
.ad-answer__after { color: var(--ink-muted); margin: 0; }
@media (max-width: 600px) { .ad-actions .ad-btn:not(.ad-btn--quiet) { flex: 1 1 100%; } }

/* 通知 */
.ad-notice { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; grid-template-areas: "mark text actions"; column-gap: var(--space-3); row-gap: var(--space-2); align-items: start; padding: var(--space-3) var(--space-4); border-radius: var(--radius-lg); border: 1px solid var(--line-strong); background: var(--surface); }
.ad-notice > .ad-mark { grid-area: mark; margin-top: 1px; }
.ad-notice__text { grid-area: text; min-width: 0; overflow-wrap: anywhere; }
.ad-notice__title, .ad-notice__body { margin: 0; }
.ad-notice__body { color: var(--ink); }
.ad-notice__actions { grid-area: actions; display: flex; flex-wrap: wrap; gap: var(--space-2); }
.ad-notice--error { background: var(--stop-soft); border-color: var(--stop-text); }
.ad-notice--error .ad-notice__title { color: var(--stop-text); }
.ad-notice--info { background: var(--surface-muted); border-color: var(--line); }
@media (max-width: 600px) { .ad-notice { grid-template-columns: auto minmax(0, 1fr); grid-template-areas: "mark text" "actions actions"; } }

/* 空状態 */
.ad-empty { display: flex; flex-direction: column; align-items: center; gap: var(--space-2); padding: var(--space-6) var(--space-4); border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--surface); text-align: center; }
.ad-empty__title, .ad-empty__body { margin: 0; }
.ad-empty__body { color: var(--ink-muted); max-width: 32em; }
.ad-empty .ad-btn { margin-top: var(--space-2); }

/* dashboard.css */
/* ダッシュボード画面のレイアウト。部品の見た目は bundle.css、値は tokens.css。 */
.ad-app { max-width: var(--content-max); margin: 0 auto; padding: var(--space-5) var(--space-4) var(--space-6); display: flex; flex-direction: column; gap: var(--space-5); }
.ad-app h1, .ad-app h2, .ad-app p { margin: 0; }

.ad-head { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--space-3); }
.ad-head > div:first-child { flex: 1 1 auto; min-width: 0; }
.ad-head__actions { flex: none; }
.ad-head__sub { color: var(--ink-muted); }
.ad-notices:empty { display: none; }

.ad-demo { border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--surface-muted); }
.ad-demo > summary { cursor: pointer; padding: var(--space-2) var(--space-4); color: var(--ink-muted); min-height: var(--control-h); display: flex; align-items: center; }
.ad-demo > summary:focus-visible { outline: 2px solid transparent; box-shadow: var(--focus-ring); border-radius: var(--radius-lg); }
.ad-demo__body { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3) var(--space-5); padding: 0 var(--space-4) var(--space-4); }
.ad-demo__set { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); margin: 0; padding: 0; border: 0; min-width: 0; }
.ad-demo__set legend { float: left; margin-right: var(--space-2); padding: 0; }
.ad-check { display: inline-flex; align-items: center; gap: var(--space-2); min-height: var(--control-h); cursor: pointer; }
.ad-check input { width: 18px; height: 18px; margin: 0; accent-color: var(--ink); }

.ad-overview { display: flex; flex-direction: column; gap: var(--space-4); padding: var(--space-4); background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); }
.ad-tiles { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) minmax(0, 1fr); gap: var(--space-4); }
.ad-tilegroup { display: flex; flex-direction: column; gap: var(--space-2); min-width: 0; }
.ad-tilegroup__tiles { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: var(--space-2); }
.ad-tilegroup__label .ad-num { font-size: 20px; }
.ad-next { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2) var(--space-4); padding-top: var(--space-4); border-top: 1px solid var(--line); }
.ad-next__label { flex: none; }
.ad-next__text { flex: 1 1 280px; min-width: 0; overflow-wrap: anywhere; }

.ad-filters { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3) var(--space-4); }
.ad-filters__agents { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); }
.ad-filters__search { flex: 1 1 240px; }
.ad-result { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-1) var(--space-2); color: var(--ink-muted); min-height: var(--control-h); margin-top: calc(var(--space-3) * -1); }
.ad-result .ad-btn { color: var(--ink); }

.ad-groups { display: flex; flex-direction: column; gap: var(--space-5); }
.ad-groups[aria-busy="true"] { opacity: .6; }
.ad-group__head { display: flex; align-items: center; gap: var(--space-2); margin: 0 0 var(--space-2); }
.ad-group__count { color: var(--ink-muted); font-weight: 400; }
.ad-list { margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); }
.ad-list > .ad-row + .ad-row { border-top: 1px solid var(--line); }

.ad-row__detail { padding-left: calc(var(--space-4) + 132px + var(--space-4)); }
.ad-detail { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: var(--space-4) var(--space-5); align-items: start; }
.ad-detail__main, .ad-detail__side { display: flex; flex-direction: column; gap: var(--space-4); min-width: 0; }

}

  /* ---------- 状態 ---------- */
  var state;
  function initialState() {

  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  function agentName(k) { return (D.AGENTS[k] || { name: k }).name; }
  function countBy(status) { return state.tasks.filter(function (t) { return t.status === status; }).length; }
  function groupOf(t) { return state.hold && state.hold.id === t.id ? state.hold.group : t.status; }
  function filterActive() { var f = state.filter; return !!(f.status || f.agent || f.q.trim()); }
  function matches(t) {
    var f = state.filter;
    if (f.status && groupOf(t) !== f.status) return false;
    if (f.agent && t.agent !== f.agent) return false;
    var q = f.q.trim().toLowerCase();
    if (q) {
      var hay = [t.title, t.id, agentName(t.agent), t.question && t.question.text, t.error && t.error.message, t.result && t.result.summary, t.progress && t.progress.current].join(' ').toLowerCase();
      if (hay.indexOf(q) < 0) return false;
    }
    return true;
  }

    return list.slice().sort(function (a, b) {
      if (g === 'wait' || g === 'stop') return (a.since || 0) - (b.since || 0); // 長く止まっているものを上に
      return b.updatedAt - a.updatedAt; // 新しく動いたものを上に

        h('div', { class: 'ad-field' },
          h('label', { class: 't-label', for: selId }, '別のAIに引き継ぐ'),
          h('select', { id: selId, class: 'ad-select t-body', 'data-fk': 'sel-' + t.id, onChange: function (ev) { state.reassign[t.id] = ev.target.value; } },
            others.map(function (k) { var o = h('option', { value: k }, agentName(k)); if (k === pick) o.selected = true; return o; }))),
        D.Button({ label: '引き継ぐ', variant: 'secondary', busy: busy && state.busyKind === 'reassign', busyLabel: '引き継ぎ中…', fk: 'hand-' + t.id, onClick: function () { reassign(t.id); } })),
      state.errors[t.id] ? h('p', { class: 'ad-error t-label', role: 'alert', tabindex: '-1', 'data-fk': 'err-' + t.id }, D.StatusMark({ status: 'stop' }), state.errors[t.id]) : null);
  }

  function renderRun(t, now) {
    var p = t.progress;
    return h('div', { class: 'ad-detail__section' },
      h('h4', { class: 't-label', style: 'margin:0' }, 'いまの作業'),
      h('p', { class: 't-body' }, p.current + '（' + D.formatAgo(t.updatedAt, now) + 'に更新）'),
      h('h4', { class: 't-label', style: 'margin:var(--space-2) 0 0' }, '進み具合 ', h('span', { class: 'ad-num' }, p.done + '/' + p.total)),
      h('ol', { class: 'ad-steps t-body' }, (t.steps || []).map(function (name, i) {
        var kind = i < p.done ? 'done' : (i === p.done ? 'run' : 'todo');
        return h('li', { class: kind === 'run' ? 'is-current' : (kind === 'todo' ? 'is-todo' : null) },
          D.StatusMark({ status: kind }), name,
          h('span', { class: 'ad-sr' }, kind === 'done' ? '（済み）' : kind === 'run' ? '（作業中）' : '（未着手）'),
          kind === 'run' ? h('span', { class: 't-meta', 'aria-hidden': 'true' }, '← いまここ') : null);
      })),
      h('p', { class: 't-meta' }, 'あなたの操作は不要です。止まったり質問が来たりすると、このページの上部に出ます。'));
  }

  function renderDone(t) {
    return h('div', { class: 'ad-detail__section' },
      h('h4', { class: 't-label', style: 'margin:0' }, '成果'),
      h('p', { class: 't-body' }, t.result.summary),
      h('h4', { class: 't-label', style: 'margin:var(--space-2) 0 0' }, '成果物'),
      h('ul', { class: 'ad-files' }, t.result.files.map(function (f) { return h('li', null, h('code', { class: 't-code' }, f)); })));
  }

  /* ---------- 操作 ---------- */
  function say(msg) { els.live.textContent = ''; setTimeout(function () { els.live.textContent = msg; }, 30); }

  function releaseHold(exceptId) {
    if (state.hold && state.hold.id !== exceptId) { delete state.flash[state.hold.id]; state.hold = null; }
  }

  function toggle(id, via) {
    var t = find(id);
    if (state.openId === id) {
      state.openId = null;
      releaseHold();
      state.focusKey = 'toggle-' + id;
    } else {
      releaseHold(id);
      state.openId = id;
      if (via === 'action') {
        if (t.status === 'wait') state.focusKey = t.question.options && t.question.options.length ? 'opt-' + id + '-0' : 'note-' + id;
        else if (t.status === 'stop') state.focusKey = 'retry-' + id;
      }
    }
    render();
  }

  function openFromAnywhere(id) {
    var t = find(id);
    if (!matches(t)) { state.filter = { status: null, agent: null, q: '' }; els.search.value = ''; say('絞り込みを解除しました'); }
    if (state.openId !== id) { releaseHold(id); state.openId = id; }
    state.focusKey = t.status === 'wait' ? 'opt-' + id + '-0' : 'retry-' + id;
    render();
  }

  function setStatusFilter(s) { state.filter.status = s; releaseHold(); render(); say(s ? D.STATUS[s].label + 'で絞り込みました' : '状態の絞り込みを解除しました'); }
  function setAgentFilter(a) { state.filter.agent = a; releaseHold(); render(); say(a ? agentName(a) + 'のタスクに絞り込みました' : '担当AIの絞り込みを解除しました'); }
  function clearFilters() {
    state.filter = { status: null, agent: null, q: '' }; els.search.value = ''; releaseHold();
    state.focusKey = 'agent-all'; render(); say('絞り込みを解除しました');
  }

  function onDraft(id, patch) {
    var d = state.drafts[id] || (state.drafts[id] = {});
    for (var k in patch) d[k] = patch[k];
    if (state.errors[id]) { delete state.errors[id]; render(); }
  }

  function failOrRun(id, kind, ok) {
    if (state.busyId) return;
    state.busyId = id; state.busyKind = kind; delete state.errors[id];
    render();
    setTimeout(function () {
      state.busyId = null; state.busyKind = null;
      if (state.failSend) {
        state.errors[id] = '送信できませんでした（通信エラー E-SEND-504）。' + (kind === 'answer' ? '入力した内容は残っています。もう一度「回答を送信」を押してください。' : '状態は変わっていません。時間をおいて、もう一度押してください。');
        state.openId = id; state.focusKey = 'err-' + id;
        render(); return;
      }
      ok(); render();
    }, SEND_DELAY);
  }

  function resumeTask(t, logText) {
    var now = Date.now();
    var snap = clone(t);
    t.status = 'run'; t.updatedAt = now;
    if (t.resume) t.progress = { done: t.progress.done, total: t.progress.total, current: t.resume };
    t.log.push({ at: now, who: 'you', text: logText });
    t.log.push({ at: now, who: t.agent, text: '作業を再開' });
    delete t.question; delete t.error;
    return snap;
  }

  function submitAnswer(id) {
    if (state.busyId) return;
    var t = find(id), d = state.drafts[id] || {};
    var hasOpt = t.question.options && t.question.options.length;
    if (!d.option && !(d.note || '').trim()) {
      state.errors[id] = hasOpt ? '選択肢を1つ選ぶか、補足欄に回答を書いてください。' : '回答を入力してください。';
      state.focusKey = 'err-' + id; render(); say(state.errors[id]); return;
    }
    failOrRun(id, 'answer', function () {
      var opt = hasOpt ? t.question.options.filter(function (o) { return o.id === d.option; })[0] : null;
      var text = '回答：' + (opt ? opt.label : '') + ((d.note || '').trim() ? (opt ? '／' : '') + d.note.trim() : '');
      var snap = resumeTask(t, text);
      state.flash[id] = { snap: snap, draft: clone(d), title: '回答を送信しました', body: agentName(t.agent) + ' が作業を再開しました。状態は「作業中」に変わりました。この行は閉じると「作業中」に移ります。' };
      delete state.drafts[id];
      state.hold = { id: id, group: 'wait' };
      state.focusKey = 'flash-' + id;
      say('回答を送信しました。' + agentName(t.agent) + ' が作業を再開しました。');
    });
  }

  function retry(id) {
    var t = find(id);
    failOrRun(id, 'retry', function () {
      var snap = resumeTask(t, '再試行を指示');
      state.flash[id] = { snap: snap, title: '再試行しました', body: agentName(t.agent) + ' が作業を再開しました。状態は「作業中」に変わりました。この行は閉じると「作業中」に移ります。' };
      state.hold = { id: id, group: 'stop' };
      state.focusKey = 'flash-' + id;
      say('再試行しました。' + agentName(t.agent) + ' が作業を再開しました。');
    });
  }

  function reassign(id) {
    var t = find(id);
    var others = Object.keys(D.AGENTS).filter(function (k) { return k !== t.agent; });
    var to = state.reassign[id] || others[0];
    failOrRun(id, 'reassign', function () {
      var from = t.agent;
      var snap = resumeTask(t, agentName(from) + ' から ' + agentName(to) + ' へ引き継ぎ');
      t.agent = to;
      t.log[t.log.length - 1].who = to;
      delete state.reassign[id];
      state.flash[id] = { snap: snap, title: agentName(to) + ' に引き継ぎました', body: agentName(to) + ' が続きから作業を始めました。状態は「作業中」に変わりました。この行は閉じると「作業中」に移ります。' };
      state.hold = { id: id, group: 'stop' };
      state.focusKey = 'flash-' + id;
      say(agentName(to) + ' に引き継ぎました。');
    });
  }

  function undo(id) {
    var f = state.flash[id]; if (!f) return;
    for (var i = 0; i < state.tasks.length; i++) if (state.tasks[i].id === id) state.tasks[i] = f.snap;
    if (f.draft) state.drafts[id] = f.draft;
    delete state.flash[id]; state.hold = null; state.openId = id;
    state.focusKey = 'toggle-' + id;
    render(); say('取り消しました。元の状態に戻しました。');
  }

  function refresh(fromBanner) {
    if (state.loading) return;
    state.loading = true; render();
    setTimeout(function () {
      state.loading = false; state.loadError = false; state.lastSync = Date.now();
      state.focusKey = fromBanner === true ? 'refresh' : null;
      render(); say('最新の状態に更新しました');
    }, 800);
  }

  function setDataMode(mode) {
    state.dataMode = mode; state.openId = null; state.hold = null; state.flash = {};
    state.tasks = mode === 'empty' ? [] : seed(Date.now());
    render(); say(mode === 'empty' ? 'データを0件にしました' : '12件のデータに戻しました');
  }

  function resetAll() {
    state = initialState(); build(); render(); say('最初の状態に戻しました');
  }

  build();
  render();
})();
</script>
</body>
</html>
